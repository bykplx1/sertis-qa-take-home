name: CI

# Runs both suites and attaches evidence of the run to every pull request.
#
# Red and blocking are separate things here, and the distinction is the whole
# policy. There is deliberately no branch-protection or required-check
# configuration in this repo - see SPEC.md "Pipeline" and issue #11 - so a red
# job blocks no merge and freezes nothing. What red means is that the run
# produced something a human should read.
#
# Under that separation, ANY non-passing test fails its job, by-design defect
# reproductions included. The earlier policy kept these jobs green over a
# suite that reproduces nineteen defects in demoblaze and api-main, on the
# reasoning that the defects live in products this repo does not own. That
# reasoning holds for *blocking* and does not hold for *colour*: a green check
# on a run whose whole value is a defect register asserts something untrue
# about the systems under test, and buries the summary a QA reader came for
# behind a tick they have no reason to click. The verdict lives in
# .github/scripts/summarize-failures.js (exit 1 for any non-passing result,
# exit 2 for a broken run) and is rendered, with its reason, into every run
# summary.
#
# A BROKEN RUN (the suite producing no usable results at all) and a type error
# in this repo's own code are still distinguished from test results, and still
# fail their job - see the "Summarize failures" and "Type-check" steps below.
on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run on the same PR/branch rather than piling up runs
# against third-party infrastructure (demoblaze) and api-main. Restricted to
# pull_request: a push to main is a merge, and two quick merges cancelling
# the first merge's run would destroy the exact evidence SPEC.md:117 says
# gets attached to it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  e2e:
    name: e2e (demoblaze)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Chromium only, per issue #11 - the e2e-firefox/e2e-webkit projects
      # and the k6 performance script are never invoked in the pipeline.
      #
      # This step still exits 0 unconditionally, recording the test process's
      # real exit code first. That is no longer about keeping the job green -
      # the summarizer below fails it on any non-passing test - but about
      # keeping the verdict in ONE place: Playwright's exit code cannot tell a
      # `test.fail()` reproduction that failed as declared (exit 0) from a
      # genuinely clean run, which is exactly the distinction this job now
      # turns on. Letting the summary step decide means the colour and the
      # reason for it are computed from the same data. `continue-on-error`
      # stays on as a backstop for the case the shell doesn't reach `exit 0`
      # (e.g. the runner kills the step); the real exit code still reaches the
      # summarizer, so a broken run is never reported as clean - see
      # .github/scripts/summarize-failures.js's "BROKEN RUN" handling.
      - name: Run @e2e suite against demoblaze
        id: run_tests
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: |
          set +e
          npx playwright test --project=e2e --reporter=html,json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Not wrapped in continue-on-error - this step IS the job's verdict.
      # summarize-failures.js exits 1 when the run produced any non-passing
      # result (failures, flakes, unexpected passes, and by-design defect
      # reproductions alike) and 2 when the run is BROKEN (missing or
      # unparseable results, or a report describing zero executed tests). The
      # two codes are kept distinct because the summary reads differently:
      # one is a statement about the system under test, the other about the
      # pipeline. Neither blocks a merge; see the header comment.
      - name: Summarize failures (by defect id)
        if: always()
        run: |
          node .github/scripts/summarize-failures.js e2e-results.json "@e2e (demoblaze)" "${{ steps.run_tests.outputs.exit_code }}"

      # Deliberately after the test+summarize steps, not before: SPEC.md:117
      # wants the run to happen and its summary posted even when this repo's
      # own code has a type error, rather than aborting the job with zero
      # tests run and nothing to show for it. Also not wrapped in
      # continue-on-error: a type error is this repo's own code, not a
      # defect in a system under test, so it's allowed to fail the job.
      - name: Type-check
        if: always()
        run: npm run typecheck

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-e2e
          path: |
            playwright-report/
            test-results/
            e2e-results.json
          retention-days: 14
          if-no-files-found: warn

  api:
    name: api (api-main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # No browser install here: the @api project drives Playwright's HTTP
      # request context only, never a browser.
      #
      # api-main is started automatically by playwright.config.ts's
      # webServer (command: "node server.js", cwd: api-main) because
      # API_BASE_URL is left unset here, so usingLocalApi is true - this
      # satisfies issue #11's "the api job starts the local api-main before
      # running" without a separate step.
      #
      # `npm run test:api` runs the exact entry point the README tells the
      # reviewer to use, which triggers package.json's "pretest:api" hook to
      # install api-main's own node_modules - no hand-copied install step
      # here. api-main is a read-only system under test (CLAUDE.md), so this
      # install can't be pinned to a lockfile without modifying it; unlike
      # the actions above, it resolves fresh every run. Accepted risk: a
      # breaking transitive release in api-main's dependencies would turn
      # this job into a BROKEN RUN with no repo change - which, per C1, no
      # longer goes unnoticed.
      #
      # See the e2e job's identical comment above: this always exits 0 after
      # capturing the real exit code, so that the summarize step below is the
      # single place the job's colour is decided, while the real code still
      # reaches the summarizer so a broken run can't render as a false pass.
      - name: Run @api suite (starts local api-main automatically)
        id: run_tests
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: api-results.json
        run: |
          set +e
          npm run test:api -- --reporter=html,json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # See the e2e job's identical comment above: not wrapped in
      # continue-on-error, because this step is the job's verdict -
      # summarize-failures.js exits 1 for any non-passing result and 2 for a
      # broken run.
      - name: Summarize failures (by defect id)
        if: always()
        run: |
          node .github/scripts/summarize-failures.js api-results.json "@api (api-main)" "${{ steps.run_tests.outputs.exit_code }}"

      # See the e2e job's identical comment above: deliberately after the
      # test+summarize steps, and not wrapped in continue-on-error, so a type
      # error in this repo's own code (including tests/api/**) still fails
      # the job, but only after the run's summary has had a chance to post.
      - name: Type-check
        if: always()
        run: npm run typecheck

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
            api-results.json
          retention-days: 14
          if-no-files-found: warn
