name: CI

# Runs both suites and attaches evidence of the run to every pull request.
# There is deliberately no branch-protection or required-check configuration
# here or anywhere else in the repo - see SPEC.md "Pipeline" and issue #11.
# The non-gating policy has a precise scope, though: a red @e2e/@api *test*
# result never blocks anything - a defect lives in a product this repo does
# not own (api-main, demoblaze), and freezing this repository over it
# achieves nothing. A BROKEN RUN (the suite producing no usable results at
# all) and a type error in this repo's own code are not test results to
# report on - both are allowed to fail their job. See the "Summarize
# failures" and "Type-check" steps below.
on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run on the same PR/branch rather than piling up runs
# against third-party infrastructure (demoblaze) and api-main. Restricted to
# pull_request: a push to main is a merge, and two quick merges cancelling
# the first merge's run would destroy the exact evidence SPEC.md:117 says
# gets attached to it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  e2e:
    name: e2e (demoblaze)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Chromium only, per issue #11 - the e2e-firefox/e2e-webkit projects
      # and the k6 performance script are never invoked in the pipeline.
      #
      # This step exits 0 unconditionally (it records the test process's
      # real exit code in `run_tests_exit_code` first) so the job's outcome
      # is never gated on the suite going red - see the header comment.
      # `continue-on-error` stays on as a backstop for the case the shell
      # itself doesn't reach the `exit 0` line (e.g. the runner kills the
      # step). Either way, the real exit code is passed to the summarizer
      # below so a broken run is never silently reported as clean - see
      # .github/scripts/summarize-failures.js's "BROKEN RUN" handling.
      - name: Run @e2e suite against demoblaze
        id: run_tests
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: |
          set +e
          npx playwright test --project=e2e --reporter=html,json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Not wrapped in continue-on-error: summarize-failures.js sets
      # process.exitCode = 2 only when the run is BROKEN (missing/unparseable
      # results, or a report describing zero executed tests) - never for a
      # normal report with failing/flaky tests. That's the one case this job
      # is allowed to go red on. A broken run is not a test failure, so the
      # non-gating policy for test failures (SPEC.md:19) stays untouched.
      - name: Summarize failures (by defect id)
        if: always()
        run: |
          node .github/scripts/summarize-failures.js e2e-results.json "@e2e (demoblaze)" "${{ steps.run_tests.outputs.exit_code }}"

      # Deliberately after the test+summarize steps, not before: SPEC.md:117
      # wants the run to happen and its summary posted even when this repo's
      # own code has a type error, rather than aborting the job with zero
      # tests run and nothing to show for it. Also not wrapped in
      # continue-on-error: a type error is this repo's own code, not a
      # defect in a system under test, so it's allowed to fail the job.
      - name: Type-check
        if: always()
        run: npm run typecheck

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-e2e
          path: |
            playwright-report/
            test-results/
            e2e-results.json
          retention-days: 14
          if-no-files-found: warn

  api:
    name: api (api-main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # No browser install here: the @api project drives Playwright's HTTP
      # request context only, never a browser.
      #
      # api-main is started automatically by playwright.config.ts's
      # webServer (command: "node server.js", cwd: api-main) because
      # API_BASE_URL is left unset here, so usingLocalApi is true - this
      # satisfies issue #11's "the api job starts the local api-main before
      # running" without a separate step.
      #
      # `npm run test:api` runs the exact entry point the README tells the
      # reviewer to use, which triggers package.json's "pretest:api" hook to
      # install api-main's own node_modules - no hand-copied install step
      # here. api-main is a read-only system under test (CLAUDE.md), so this
      # install can't be pinned to a lockfile without modifying it; unlike
      # the actions above, it resolves fresh every run. Accepted risk: a
      # breaking transitive release in api-main's dependencies would turn
      # this job into a BROKEN RUN with no repo change - which, per C1, no
      # longer goes unnoticed.
      #
      # See the e2e job's identical comment above: this always exits 0 after
      # capturing the real exit code, so the job's outcome is never gated on
      # the suite going red, but the real code still reaches the summarizer
      # so a broken run can't render as a false pass.
      - name: Run @api suite (starts local api-main automatically)
        id: run_tests
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: api-results.json
        run: |
          set +e
          npm run test:api -- --reporter=html,json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # See the e2e job's identical comment above: not wrapped in
      # continue-on-error, since summarize-failures.js only sets
      # process.exitCode = 2 for a BROKEN RUN, never for a normal report with
      # failing/flaky tests.
      - name: Summarize failures (by defect id)
        if: always()
        run: |
          node .github/scripts/summarize-failures.js api-results.json "@api (api-main)" "${{ steps.run_tests.outputs.exit_code }}"

      # See the e2e job's identical comment above: deliberately after the
      # test+summarize steps, and not wrapped in continue-on-error, so a type
      # error in this repo's own code (including tests/api/**) still fails
      # the job, but only after the run's summary has had a chance to post.
      - name: Type-check
        if: always()
        run: npm run typecheck

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
            api-results.json
          retention-days: 14
          if-no-files-found: warn
